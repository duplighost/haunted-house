<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>The House on Mercer Lane</title>
<style>
  :root { --fg: #e8e2d4; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: Georgia, "Times New Roman", serif; color: var(--fg); user-select: none; -webkit-user-select: none; touch-action: none; }
  #game { position: fixed; inset: 0; display: block; }

  /* Vignette + grain overlay that sells the "dark house" mood */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 38%, rgba(0,0,0,0.55) 78%, rgba(0,0,0,0.9) 100%);
    transition: background 1.2s ease;
  }

  /* Crosshair */
  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; z-index: 6;
    margin: -3px 0 0 -3px; border-radius: 50%;
    background: rgba(230,230,220,0.35); pointer-events: none;
    box-shadow: 0 0 4px rgba(0,0,0,0.8); transition: opacity .3s, transform .2s;
  }
  #crosshair.hot { background: rgba(255,240,200,0.9); transform: scale(1.6); }

  /* Player inner monologue (distinct, glitchy, italic) */
  #thought {
    position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%);
    z-index: 7; max-width: min(760px, 86vw); text-align: center;
    font-style: italic; font-size: clamp(16px, 2.4vw, 24px); line-height: 1.4;
    color: #cfe7ef; letter-spacing: .5px; opacity: 0; pointer-events: none;
    text-shadow: 0 0 10px rgba(120,200,220,0.5), 0 2px 4px #000;
  }
  #thought.show { opacity: 1; animation: flicker 3.2s ease both; }
  @keyframes flicker {
    0% { opacity: 0; filter: blur(3px); }
    8% { opacity: 1; filter: blur(0); }
    10% { opacity: .4; } 12% { opacity: 1; }
    82% { opacity: 1; filter: blur(0); }
    100% { opacity: 0; filter: blur(2px); }
  }

  /* NPC speech (different style: plain, with a name tag) */
  #speech {
    position: fixed; left: 50%; bottom: 9%; transform: translateX(-50%);
    z-index: 7; max-width: min(720px, 84vw); text-align: center;
    font-size: clamp(15px, 2.1vw, 21px); color: #efe9da; opacity: 0;
    pointer-events: none; text-shadow: 0 2px 6px #000, 0 0 2px #000;
    transition: opacity .35s;
  }
  #speech.show { opacity: 1; }
  #speech .who { display:block; font-size: .72em; letter-spacing: 2px; text-transform: uppercase; color: #b9a17e; margin-bottom: 4px; }

  /* Start / title screen */
  #overlay {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(ellipse at center, #0b0d11 0%, #000 75%);
    transition: opacity 1s ease;
  }
  #overlay h1 { font-size: clamp(30px, 6vw, 62px); font-weight: normal; letter-spacing: 4px; color: #d8cfb8; text-shadow: 0 0 24px rgba(120,140,160,.35); }
  #overlay .sub { margin-top: 10px; font-style: italic; color: #8b97a3; font-size: clamp(14px,2.4vw,19px); }
  #overlay .start {
    margin-top: 42px; padding: 14px 40px; border: 1px solid #5a6470; border-radius: 2px;
    background: rgba(20,24,30,.6); color: #e8e2d4; font-size: 20px; letter-spacing: 2px;
    cursor: pointer; transition: all .25s; font-family: inherit;
  }
  #overlay .start:hover { background: rgba(60,70,84,.7); border-color: #aab4c0; }
  #overlay .hint { margin-top: 30px; color: #5e6670; font-size: 13px; line-height: 1.9; letter-spacing:1px; }
  #loading { color:#6a7280; font-size:14px; margin-top:30px; letter-spacing:2px; }

  /* End screen */
  #endscreen {
    position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 8vw;
    background: #000; opacity: 0; transition: opacity 2.5s ease;
  }
  #endscreen h2 { font-size: clamp(28px, 5vw, 52px); letter-spacing: 8px; color: #c9c2b0; font-weight: normal; }
  #endscreen p { margin-top: 28px; max-width: 640px; line-height: 1.8; color: #8a8475; font-style: italic; font-size: clamp(15px,2.3vw,18px); }
  #endscreen .again { margin-top: 40px; color:#5e6670; font-size: 14px; letter-spacing:2px; cursor:pointer; border-bottom:1px solid #333; padding-bottom:3px; }

  /* Touch controls */
  #touch { position: fixed; inset: 0; z-index: 8; display: none; }
  .stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px;
    border-radius: 50%; border: 2px solid rgba(220,220,210,.25); background: rgba(255,255,255,.05);
    pointer-events: none; opacity: 0; transition: opacity .15s; }
  .stick .nub { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: rgba(230,230,220,.35); }
  .stick.active { opacity: 1; }

  /* Interact prompt */
  #prompt { position: fixed; left: 50%; top: 58%; transform: translateX(-50%); z-index: 7;
    color: #d8cfb8; font-size: 16px; letter-spacing: 1px; opacity: 0; transition: opacity .3s;
    text-shadow: 0 2px 6px #000; pointer-events:none; }
  #prompt.show { opacity: 1; }

  #flashbtn { position: fixed; right: 18px; bottom: 18px; z-index: 9; width: 64px; height: 64px;
    border-radius: 50%; border: 1px solid rgba(220,220,210,.3); background: rgba(20,24,30,.5);
    color: #d8cfb8; font-size: 11px; letter-spacing: 1px; display: none; align-items:center; justify-content:center;
    text-align:center; cursor:pointer; }
  .fade-black { position: fixed; inset: 0; background:#000; z-index: 25; opacity: 0; pointer-events: none; transition: opacity 1.4s ease; }
  .fade-black.on { opacity: 1; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <div id="crosshair"></div>
  <div id="thought"></div>
  <div id="speech"></div>
  <div id="prompt"></div>
  <div id="fade" class="fade-black"></div>

  <div id="touch">
    <div id="stickL" class="stick"><div class="nub"></div></div>
    <div id="stickR" class="stick"><div class="nub"></div></div>
  </div>
  <button id="flashbtn">TORCH</button>

  <div id="overlay">
    <h1>THE HOUSE ON MERCER LANE</h1>
    <div class="sub">Some doors are better left unopened.</div>
    <button class="start" id="startbtn" disabled>LOADING…</button>
    <div class="hint" id="controlhint"></div>
  </div>

  <div id="endscreen">
    <h2 id="endtitle">ARRESTED</h2>
    <p id="endtext"></p>
    <div class="again" id="againbtn">— play again —</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
